name: Build macOS

# Builds an unsigned macOS .dmg + .zip for arm64 and x64 separately.
# Triggered manually or on tag push (v*).
# Note: builds are NOT signed (no Apple Developer cert). Users will need to
# right-click → Open the first time to bypass Gatekeeper. Sign + notarize
# will be added when monetization (LemonSqueezy) lands.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Bump when a newer python-build-standalone release is available.
  # Latest releases: https://github.com/astral-sh/python-build-standalone/releases
  # Note: depuis 2024 le repo est sous astral-sh, pas indygreg.
  PYTHON_VERSION: "3.13.13"
  PYTHON_BUILD_TAG: "20260510"

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - electron_arch: arm64
            python_arch: aarch64
          - electron_arch: x64
            python_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        working-directory: ./src
        # On supprime le package-lock.json avant npm install :
        # le lockfile est généré sur Windows et référence les binaires natifs
        # rollup/swc/etc. Windows-only ; npm a un bug connu (npm/cli#4828) qui
        # fait qu'il n'installe pas les variantes Mac manquantes même en
        # `npm install` quand le lockfile est présent. La régénération à la
        # volée règle le problème pour ce build CI.
        # `dmg-license` est requis par dmg-builder sur Mac mais reste hors
        # lockfile (peerDep optionnelle), `--no-save` pour pas polluer
        # package.json.
        run: |
          rm -f package-lock.json
          npm install
          npm install dmg-license --no-save

      - name: Download Python portable (${{ matrix.python_arch }})
        run: |
          set -euo pipefail
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_BUILD_TAG}/cpython-${PYTHON_VERSION}+${PYTHON_BUILD_TAG}-${{ matrix.python_arch }}-apple-darwin-install_only.tar.gz"
          echo "Downloading: $URL"
          curl -L --fail -o python.tar.gz "$URL"
          mkdir -p python-portable
          # python-build-standalone "install_only" extrait dans un dossier "python/" — on strip pour avoir bin/, lib/, etc. directement
          tar -xzf python.tar.gz -C python-portable --strip-components=1
          rm python.tar.gz
          ./python-portable/bin/python3 --version

      - name: Install PyMuPDF in Python portable
        run: |
          set -euo pipefail
          ./python-portable/bin/python3 -m pip install --no-cache-dir pymupdf

      - name: Build app for ${{ matrix.electron_arch }}
        working-directory: ./src
        env:
          # Empêche electron-builder de tenter de signer / notariser
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # 1. tsc compile main + preload TypeScript -> dist-electron/
        # 2. vite build le renderer React -> dist/
        # 3. electron-builder package le tout en .dmg + .zip
        run: |
          npx tsc
          npx vite build
          npx electron-builder --mac --${{ matrix.electron_arch }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extract-mac-${{ matrix.electron_arch }}
          path: |
            src/release/*.dmg
            src/release/*.zip
          if-no-files-found: error
          retention-days: 14
